name: Steam and UI checks
on:
  push:
    branches: [ui-ux]
    paths:
      - 'app/Madeira/**/*.swift'
      - 'app/Madeira/SwiftSteam/**'
      - 'app/Madeira.xcodeproj/**'
      - 'app/Madeira/Info.plist'
      - 'tests/host/**'
      - 'tools/package-local-ipa.py'
      - 'tools/build-receipts.py'
      - 'docs/upstream-state.json'
      - 'build/**'
      - 'app/Madeira/Winios/**'
      - 'wine'
      - 'FEX'
      - '.github/workflows/steam-ui-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/Madeira/*.swift
            /app/Madeira/*.h
            /app/Madeira/Info.plist
            /app/Madeira/SwiftSteam/
            /app/Madeira.xcodeproj/project.pbxproj
            /tests/host/
            /LICENSES/
            /THIRD-PARTY-NOTICES.md
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libssl-dev liblzma-dev zlib1g-dev
          swiftc --version
      - name: Download, DLC, resume and ownership fixtures
        env:
          CC: clang
        run: python3 tests/host/check-steam-library.py
  cloud-and-ui:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cloud decisions
        run: python3 tests/host/check-steam-cloud.py
      - name: Native and compatibility archive precedence
        run: python3 tests/host/check-local-package.py
      - name: Parse app Swift sources
        run: find app/Madeira -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Orientation session transitions
        run: python3 tests/host/check-orientation.py
      - name: Trackpad gesture lifetimes
        run: python3 tests/host/check-trackpad.py
      - name: Typecheck changed UI against the iOS SDK
        run: python3 tests/host/check-steam-ui.py
      - name: Upstream controller and library regressions
        run: |
          python3 - <<'PY'
          import subprocess, sys
          checks = ['touch-gamepad', 'library-groups', 'steam-games', 'frontend', 'wine-mono']
          failed = []
          for check in checks:
              print(f'::group::{check}', flush=True)
              if subprocess.run([sys.executable, f'tests/host/check-{check}.py']).returncode:
                  failed.append(check)
              print('::endgroup::', flush=True)
          if failed: sys.exit('Failed: ' + ', '.join(failed))
          PY
  upstream-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Matching runtime sources
        run: git submodule update --init --depth 1 wine FEX
      - name: Runtime and input regressions
        env:
          CC: clang
        run: |
          python3 - <<'PY'
          import subprocess, sys
          checks = ['gamepad', 'pad-output', 'hidpad', 'hw-registry', 'child-desktop',
                    'child-ntdll-alias', 'ec-conhost', 'free-delay', 'iat-sync-owner',
                    'image-reload', 'kmt-adapter', 'stale-heal-owner', 'audio-downmix',
                    'audio-wow64', 'd3d12-tiled']
          failed = []
          # DataFix's Windows harness is run on the Windows development host.
          for check in checks + ['input-queue', 'thin-reserve', 'file-lookup']:
              print(f'::group::{check}', flush=True)
              command = [sys.executable, f'tests/host/check-{check}.py']
              if check == 'input-queue': command += ['--cc', 'clang']
              if subprocess.run(command).returncode: failed.append(check)
              print('::endgroup::', flush=True)
          if failed: sys.exit('Failed: ' + ', '.join(failed))
          PY
